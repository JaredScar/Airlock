[workspace]
resolver = "3"
members = [
    "crates/airlock-core",
    "crates/airlock-detect",
    "crates/airlock-asr",
    "crates/airlock-llm",
    "crates/airlock-vision",
    "crates/airlock-media",
    "crates/airlock-pipeline",
    "apps/desktop/src-tauri",
]
# `cargo test` / `cargo check` at the root only touch the engine crates, so they
# run on any machine without Tauri's system deps (webkit2gtk on Linux).
default-members = [
    "crates/airlock-core",
    "crates/airlock-detect",
    "crates/airlock-asr",
    "crates/airlock-llm",
    "crates/airlock-vision",
    "crates/airlock-media",
    "crates/airlock-pipeline",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
authors = ["Jared Scarito <thewolfbadger@gmail.com>"]

[workspace.dependencies]
airlock-core = { path = "crates/airlock-core" }
airlock-detect = { path = "crates/airlock-detect" }
airlock-asr = { path = "crates/airlock-asr" }
airlock-llm = { path = "crates/airlock-llm" }
airlock-vision = { path = "crates/airlock-vision" }
airlock-media = { path = "crates/airlock-media" }
airlock-pipeline = { path = "crates/airlock-pipeline" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
regex = "1"
ts-rs = "12"
