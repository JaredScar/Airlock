[package]
name = "airlock-asr"
description = "Speech recognition providers (local Whisper first, cloud optional) behind one trait"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
whisper = ["dep:whisper-rs"]
parakeet = ["dep:parakeet-rs"]
cuda = ["whisper", "whisper-rs/cuda", "parakeet", "parakeet-rs/cuda"]

[dependencies]
airlock-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
ureq = "2.12"
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
whisper-rs = { version = "0.15", optional = true }
parakeet-rs = { version = "0.4.4", optional = true }
