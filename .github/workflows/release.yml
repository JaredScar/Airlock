name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows exe and msi
            platform: windows-latest
            bundles: nsis,msi
          - name: macOS dmg
            platform: macos-latest
            bundles: dmg
          - name: Linux deb and AppImage
            platform: ubuntu-22.04
            bundles: deb,appimage
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.92.0

      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "18"

      - name: Export build tools
        shell: bash
        run: |
          echo "CMAKE_GENERATOR=Ninja" >> "${GITHUB_ENV}"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            echo "LIBCLANG_PATH=${LLVM_PATH}/bin" >> "${GITHUB_ENV}"
          else
            echo "LIBCLANG_PATH=${LLVM_PATH}/lib" >> "${GITHUB_ENV}"
          fi
          if [ "${RUNNER_OS}" = "macOS" ]; then
            sdk="$(xcrun --show-sdk-path)"
            echo "SDKROOT=${sdk}" >> "${GITHUB_ENV}"
            echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "${GITHUB_ENV}"
            echo "CMAKE_OSX_DEPLOYMENT_TARGET=11.0" >> "${GITHUB_ENV}"
            echo "BINDGEN_EXTRA_CLANG_ARGS=-isysroot ${sdk}" >> "${GITHUB_ENV}"
          fi

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Ninja
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y
          }

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            file \
            cmake \
            pkg-config \
            libssl-dev \
            build-essential \
            fakeroot \
            libtinfo5

      - name: WiX for the MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "wix"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile (Join-Path $dest "wix.zip")
          Expand-Archive (Join-Path $dest "wix.zip") -DestinationPath (Join-Path $dest "bin")
          Add-Content $env:GITHUB_PATH (Join-Path $dest "bin")

      - name: Install the UI
        working-directory: apps/desktop
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Airlock ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: |
            Unsigned installers from the GitHub runners. These builds use CPU speech. The local CUDA installer is separate.
            Windows: NSIS setup exe and MSI. macOS: Apple Silicon DMG, ad-hoc signed and not notarized. Linux: deb and AppImage.
            On-screen text recognition in this build is the Windows OCR path.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true
          retryAttempts: 1
          args: --config src-tauri/tauri.ci.json --bundles ${{ matrix.bundles }}
