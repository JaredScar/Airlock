[package]
name = "airlock-desktop"
description = "Airlock desktop app: Tauri shell hosting the engine and the review UI"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (cargo#8519).
name = "airlock_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Links Whisper against the CUDA toolkit. `cargo test` does not enable this.
cuda = ["airlock-asr/cuda"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde.workspace = true
serde_json.workspace = true
airlock-core.workspace = true
airlock-media.workspace = true
airlock-pipeline.workspace = true
airlock-llm.workspace = true
airlock-asr = { workspace = true, features = ["whisper"] }
keyring = { version = "3", features = ["windows-native"] }
